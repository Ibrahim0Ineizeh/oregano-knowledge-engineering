   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153247" x="156.41856" y="172.9584" transform="rotate(-0 156.41856 172.9584)">Prepare the data</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(96.062248 208.800835)">Normalize identifiers; split</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(73.161435 222.248575)">targets into proteins and molecules.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #207c80" x="356.13216" y="144.728352" transform="rotate(-0 356.13216 144.728352)">02  ·  BUILD</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153247" x="458.208" y="172.9584" transform="rotate(-0 458.208 172.9584)">Construct the ontology</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(397.971719 208.800835)">Create classes, attributes,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(394.584969 222.248575)">instances, and 17 relations.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #207c80" x="657.9216" y="144.728352" transform="rotate(-0 657.9216 144.728352)">03  ·  EXPLORE</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153247" x="759.99744" y="172.9584" transform="rotate(-0 759.99744 172.9584)">Query and visualize</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(694.689659 208.800835)">Count entities and relations;</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(683.370784 222.248575)">inspect coverage and subgraphs.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #207c80" x="54.34272" y="338.546592" transform="rotate(-0 54.34272 338.546592)">04  ·  TRACE</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153247" x="156.41856" y="366.77664" transform="rotate(-0 156.41856 366.77664)">Follow indirect paths</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(66.229091 402.619075)">Trace compound–protein–gene–disease</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(77.01106 416.066815)">paths and match indication codes.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #207c80" x="356.13216" y="338.546592" transform="rotate(-0 356.13216 338.546592)">05  ·  MODEL</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153247" x="458.208" y="366.77664" transform="rotate(-0 458.208 366.77664)">Build a Bayesian model</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(377.713031 402.619075)">Restrict the graph; assign heuristic</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(389.867813 416.066815)">conditional probability tables.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #207c80" x="657.9216" y="338.546592" transform="rotate(-0 657.9216 338.546592)">06  ·  REVIEW</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153247" x="759.99744" y="366.77664" transform="rotate(-0 759.99744 366.77664)">Rank and reflect</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(687.410159 402.619075)">Compare saved sample counts;</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #586b77" transform="translate(684.842784 416.066815)">check identifiers and limitations.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #207c80" x="458.208" y="288.828" transform="rotate(-0 458.208 288.828)">BUILD AND EXPLORE  →  TRACE, MODEL, AND REVIEW</text>
   </g>
